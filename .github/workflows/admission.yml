name: Feed admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-admission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check source pins and channel policy
        run: |
          test -f keys/couch-integrations.rsa.pub
          python3 scripts/validate_feed.py --pins-only
          python3 -c 'import json; policy=json.load(open("feed-policy.json")); assert policy["channels"]["stable"]["ids"] == []'
          python3 -m unittest discover -s tests -v

  source-admission:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          path: feed
      - name: Check out every exact source pin
        working-directory: feed
        run: scripts/checkout_sources.sh ../sources
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: armv7-unknown-linux-musleabihf
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - name: Validate reusable core protocol and package host
        working-directory: sources/tooling
        run: |
          cargo test --locked --manifest-path clients/Cargo.toml -p couch-plugin --test protocol
          python3 tools/integrations/validate_catalog.py
          python3 -m unittest tools.integrations.test_validate_catalog -v
          cargo test --locked --manifest-path daemon/Cargo.toml -p couch-integrations
      - name: Run each independent integration's locked admission suite
        working-directory: feed
        run: |
          python3 scripts/validate_feed.py --sources ../sources --emit-selected >"$RUNNER_TEMP/selected.tsv"
          while IFS=$'\t' read -r id cargo_manifest package binary manifest repository commit sdk_commit; do
            cargo fmt --manifest-path "../sources/integrations/$id/$cargo_manifest" -- --check
            cargo test --locked --all-targets --manifest-path "../sources/integrations/$id/$cargo_manifest"
          done <"$RUNNER_TEMP/selected.tsv"
      - name: Preserve native catalog and package-host admission
        working-directory: sources/tooling
        run: |
          tools/fetch-zig.sh
          . tools/arm-cc-env.sh
          jq -r '.integrations[] | [.cargo_package, .binary] | @tsv' integrations/catalog.json >"$RUNNER_TEMP/catalog.tsv"
          while IFS=$'\t' read -r package binary; do
            (cd clients && cargo build --locked --release --target armv7-unknown-linux-musleabihf -p "$package" --bin "$binary")
          done <"$RUNNER_TEMP/catalog.tsv"
          (cd daemon && cargo build --locked --release --target armv7-unknown-linux-musleabihf -p couch-confd)
          tools/integrations/smoke.sh "$RUNNER_TEMP/native-catalog-smoke"

  build-artifact:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # build-secrets.json names the only build-time secrets, and they live in the
    # package-build environment, which admits the main branch alone. A pull
    # request runs this job with no environment: every secret below is then
    # empty and an allowlisted integration compiles its own placeholder. Only a
    # main-branch payload is ever signed, and that build fails without them.
    # Never add a cache to this job, and never reuse package-signing here.
    environment: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'package-build' || '' }}
    env:
      COUCH_FEED_REQUIRE_BUILD_SECRETS: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: feed
      - name: Check out every exact source pin
        working-directory: feed
        run: scripts/checkout_sources.sh ../sources
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - name: Install the pinned ARM C toolchain
        working-directory: sources/tooling
        run: tools/fetch-zig.sh
      - name: Fetch locked dependencies of integrations that receive a build secret
        working-directory: feed
        run: scripts/build_with_secrets.sh fetch ../sources
      - name: Compile integrations that receive a build secret, offline
        working-directory: feed
        env:
          COUCH_SONOS_BUILT_IN_API_KEY: ${{ secrets.COUCH_SONOS_BUILT_IN_API_KEY }}
        run: scripts/build_with_secrets.sh compile ../sources "$RUNNER_TEMP/secret-stage"
      - name: Build unsigned, reviewable ARM payloads
        working-directory: feed
        run: scripts/build_artifact.sh ../sources "$RUNNER_TEMP/payload" "$RUNNER_TEMP/secret-stage"
      - name: Require every build secret to stay inside its own binary
        working-directory: feed
        env:
          COUCH_SONOS_BUILT_IN_API_KEY: ${{ secrets.COUCH_SONOS_BUILT_IN_API_KEY }}
        run: python3 scripts/build_secret_guard.py payload "$RUNNER_TEMP/payload"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-armv7-payload
          path: ${{ runner.temp }}/payload
          if-no-files-found: error
          retention-days: 14

  publisher-smoke:
    needs: build-artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          path: feed
      - name: Check out every exact source pin
        working-directory: feed
        run: scripts/checkout_sources.sh ../sources
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf
      - uses: actions/download-artifact@v4
        with:
          name: preview-armv7-payload
          path: ${{ runner.temp }}/payload
      - name: Build the pinned ARM package host
        working-directory: sources/tooling
        run: |
          tools/fetch-zig.sh
          . tools/arm-cc-env.sh
          cd daemon
          cargo build --locked --release --target armv7-unknown-linux-musleabihf -p couch-confd
      - name: Sign twice with a disposable key and verify immutable output
        working-directory: feed
        run: scripts/test_publish.sh "$PWD" ../sources "$RUNNER_TEMP/payload"

  admission:
    if: always()
    needs: [policy, source-admission, build-artifact, publisher-smoke]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every feed admission layer
        env:
          POLICY: ${{ needs.policy.result }}
          SOURCES: ${{ needs.source-admission.result }}
          ARTIFACT: ${{ needs.build-artifact.result }}
          PUBLISHER: ${{ needs.publisher-smoke.result }}
        run: |
          test "$POLICY" = success
          test "$SOURCES" = success
          test "$ARTIFACT" = success
          test "$PUBLISHER" = success
